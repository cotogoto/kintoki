#
# default cabocharc file
#

# Output Format
#  0 - tree
#  1 - lattice
output-format = 0

# Input Layer
#  0 - RAW sentence layer (default)
#  1 - POS tagged layer
#  2 - POS tagged and Chunked layer
#  3 - POS tagged, Chunked and Feature selected layer
input-layer = 0

# Output Layer
#  1 - POS tagged layer
#  2 - Chunked layer
#  3 - Chunked and Feature selected layer
#  4 - Parsed layer (default)
output-layer = 4

# Parser model file name
parser-model  = dep.ipa.model

# Chunker model file name
chunker-model = chunk.ipa.model

# Named entity model file name
ne-model = ne.ipa.model

# Named entity model file name
ne-model = ne.ipa.model

# Sudachi
sudachi-dict = ./

# Named entity mode
#  0 - without NE (default)
#  1 - output NE with chunk constraint
#  2 - output NE without chunk constraint
ne = 0
